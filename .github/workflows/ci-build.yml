name: CI (pull_request & push)  
  
on:  
  push:  
    branches: [main, release-*]  
  pull_request:  
    branches: [main, release-*]  
  
jobs:  
  lint:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:  
          go-version: '1.25.0'  
          cache: true 
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest  
      - run: make lint  
  
  test:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:  
          go-version: '1.25.0'  
          cache: true  
      - name: Run unit tests with race detection
        run: go test -race ./...
  
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache: true
      - name: Run Cursus restart recovery E2E
        run: RUN_CURSUS_E2E=1 go test -v -tags e2e ./test -run TestCursusRestartRecoveryE2E -count=1

  build:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:  
          go-version: '1.25.0'  
          cache: true  
      - run: make build  
