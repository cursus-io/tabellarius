version: "3.9"

services:
  broker:
    image: ghcr.io/cursus-io/cursus@sha256:3c10951cce9c0e5fd4c0ab690b143311fae9c44921b189576ace72791c90a725
    container_name: tabellarius-cursus
    command: ["./broker"]
    environment:
      BROKER_BIND_ADDRESS: 0.0.0.0
      ALLOW_INSECURE_CLIENT_TRANSPORT: "true"
      ADVERTISED_CLIENT_HOST: broker
    ports:
      - "9000:9000"
      - "9080:9080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/ready"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql:
    image: mysql:8.0
    container_name: cdc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root # mysql -u root -p root
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 10

  cdc-cli:
    build: ..
    container_name: cdc-cli
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./cdc-config.yaml:/app/cdc-config.yaml
    entrypoint: ["cdc-cli"]
    command: ["--mode", "init", "--apply=true"]

  cdc-server:
    build: ..
    container_name: cdc-server
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      - ./cdc-config.yaml:/app/cdc-config.yaml
      - ./cursus-config.integration.yaml:/config.yaml:ro
    entrypoint: ["cdc-server"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15
