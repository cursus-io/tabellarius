version: "3.9"

services:
  broker:
    image: ghcr.io/cursus-io/cursus@sha256:62ef32f2a9ad5ed0f5c1235792e88432073c0b60aaefdc4acf1065203519e97a
    container_name: tabellarius-cursus
    command: ["./broker"]
    environment:
      ADVERTISED_CLIENT_HOST: broker
    ports:
      - "9000:9000"
      - "9080:9080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9080/ready"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql:
    image: mysql:8.0
    container_name: cdc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root # mysql -u root -p root
      MYSQL_DATABASE: mydb
    ports:
      - "3306:3306"
    command:
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 10

  cdc-cli:
    build: ..
    container_name: cdc-cli
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./cdc-config.yaml:/app/cdc-config.yaml
    entrypoint: ["cdc-cli"]
    command: ["--mode", "init", "--apply=true"]

  cdc-server:
    build: ..
    container_name: cdc-server
    depends_on:
      mysql:
        condition: service_healthy
      broker:
        condition: service_healthy
    volumes:
      - ./cdc-config.yaml:/app/cdc-config.yaml
      - ./cursus-config.integration.yaml:/config.yaml:ro
    entrypoint: ["cdc-server"]
