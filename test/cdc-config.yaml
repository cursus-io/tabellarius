database:
  type: mysql
  schema: mydb
  user: root
  password: root
  host: mysql
  port: 3306

cdc_log:
  table: cdc_log

tables:
  - name: orders
    pk: id
    include_columns: [id, user_id, amount, status, created_at]
  - name: users
    pk: id
    include_columns: [id, email, name, created_at]

cdc_server:
  server_id: 9106002
  offset_file: /tmp/tabellarius-offset
  publisher_config: /config.yaml
  require_gtid: true
  allow_single_replica_publisher: true
  health_address: :8080
